name: CI Pipeline

# Quand déclencher ce workflow
on:
  # Sur chaque push sur les branches main ou develop
  push:
    branches: [ main, develop ]
  
  # Sur chaque Pull Request vers main
  pull_request:
    branches: [ main ]
  
  # Permet de déclencher manuellement depuis l'UI GitHub
  workflow_dispatch:

# Les jobs à exécuter
jobs:
  # Job 1: Validation du code
  lint-and-test:
    # Nom affiché dans l'UI GitHub
    name: Lint & Test
    
    # Runner: machine virtuelle Ubuntu
    runs-on: ubuntu-latest
    
    # Étapes du job
    steps:
    # Étape 1: Récupérer le code
    - name: Checkout repository
      uses: actions/checkout@v3
    
    # Étape 2: Configurer Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'  # Version de Node.js
        cache: 'npm'        # Active le cache npm
    
    # Étape 3: Installer les dépendances
    - name: Install dependencies
      run: npm ci  # Utilise npm ci pour des installations propres
    
    # Étape 4: Linter le code
    - name: Run ESLint
      run: npm run lint
    
    # Étape 5: Exécuter les tests
    - name: Run tests
      run: npm test
    
    # Étape 6: Build l'application
    - name: Build application
      run: npm run build

  # Job 2: Notifications (s'exécute après le premier job)
  notify:
    name: Notifications
    runs-on: ubuntu-latest
    
    # Ce job dépend du succès du job lint-and-test
    needs: lint-and-test
    
    # S'exécute seulement si le job précédent réussit
    if: success()
    
    steps:
    - name: Success notification
      run: |
        echo "✅ Tous les tests ont réussi!"
        echo "Workflow: ${{ github.workflow }}"
        echo "Référence: ${{ github.ref }}"
        echo "SHA: ${{ github.sha }}"
    
  # Job 3: En cas d'échec
  on-failure:
    name: On Failure
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    # S'exécute seulement si le job précédent échoue
    if: failure()
    
    steps:
    - name: Failure notification
      run: |
        echo "❌ Des tests ont échoué!"
        echo "Veuillez vérifier les logs."
        echo "Lien du workflow: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"